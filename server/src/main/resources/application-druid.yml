# 数据源配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet-hospital?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: ${MYSQL_USERNAME:root}
    # 口令必须由环境变量提供，仓库内不保留默认值；本地开发可放到被 gitignore 的 application-local.yml
    password: ${MYSQL_PASSWORD}
    druid:
      # 主库数据源配置
      master:
        # 连接池配置
        initialSize: 5
        minIdle: 10
        maxActive: 20
        maxWait: 60000
        # 其他Druid特定配置...
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        # 监控台默认关闭。需要时设 DRUID_MONITOR_ENABLED=true，并同时覆盖 USER/PASSWORD 两个环境变量
        enabled: ${DRUID_MONITOR_ENABLED:false}
        url-pattern: /druid/*
        login-username: ${DRUID_MONITOR_USER:changeme}
        login-password: ${DRUID_MONITOR_PASSWORD:changeme}
    filter:
      stat:
        enabled: true
        # 慢SQL记录
        log-slow-sql: true
        slow-sql-millis: 1000
        merge-sql: true
      wall:
        config:
          # 禁止堆叠语句，避免任一处 SQL 注入被放大成多语句执行
          multi-statement-allow: false
